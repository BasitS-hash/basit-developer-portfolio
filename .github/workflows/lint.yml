name: HTML & CSS Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-html:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install html-validate
        run: npm install -g html-validate

      - name: Validate index.html
        run: html-validate --config .htmlvalidate.json index.html

  lint-css:
    name: Lint CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stylelint
        run: npm install -g stylelint stylelint-config-standard

      - name: Lint styles/style.css
        run: stylelint --config .stylelintrc.json "styles/**/*.css"
